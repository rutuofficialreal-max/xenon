# Project-wide Gradle settings.

# Memory settings kept modest so the project also builds on low-RAM machines
# and inside constrained CI containers.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.workers.max=1

# Kotlin compiler runs inside the Gradle JVM (avoids spawning a second daemon).
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.incremental=false

# AndroidX + modern resource handling.
android.useAndroidX=true
android.nonTransitiveRClass=true
